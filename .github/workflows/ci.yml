name: CI

on:
  push:
    branches: [master]
  pull_request:

# The runner's default Xcode is used on purpose. Pinning a non-default one
# (Xcode_16.2 was pinned before) is fragile: the image ships the iOS platform
# only for its default Xcode, so iOS destinations failed with
# "iOS 18.2 is not installed". Every macOS 15 image defaults to Xcode 16 or
# later, which is what Swift 6 language mode requires.

jobs:
  test:
    name: Unit tests (SwiftPM, Swift 6 mode)
    runs-on: macos-15
    steps:
      # v5 runs on Node.js 24; v4 targets the deprecated Node.js 20.
      - uses: actions/checkout@v5
      - name: Show toolchain
        run: swift --version
      # `swift test` only builds the test target's dependencies, so build every
      # target explicitly to type-check the SwiftUI one too.
      - name: Build all targets
        run: swift build --build-tests
      - name: Run tests
        run: swift test --enable-code-coverage

  build-ios:
    name: Build for iOS
    runs-on: macos-15
    steps:
      # v5 runs on Node.js 24; v4 targets the deprecated Node.js 20.
      - uses: actions/checkout@v5
      - name: Show toolchain
        run: xcodebuild -version && xcodebuild -showsdks
      - name: Build UIKit target
        run: |
          xcodebuild build \
            -scheme SwipeShrink \
            -destination 'generic/platform=iOS Simulator' \
            SWIFT_STRICT_CONCURRENCY=complete
      - name: Build SwiftUI target
        run: |
          xcodebuild build \
            -scheme SwipeShrinkUI \
            -destination 'generic/platform=iOS Simulator' \
            SWIFT_STRICT_CONCURRENCY=complete

  build-example:
    name: Build example app
    runs-on: macos-15
    steps:
      # v5 runs on Node.js 24; v4 targets the deprecated Node.js 20.
      - uses: actions/checkout@v5
      - name: Show toolchain
        run: xcodebuild -version && xcodebuild -showsdks
      - name: Install XcodeGen
        run: brew install xcodegen
      # The project is generated from SwipeShrinkExample/project.yml rather than
      # checked in, so CI also verifies the spec still produces a valid project.
      - name: Generate project
        run: make project
      - name: Build example
        run: |
          xcodebuild build \
            -project SwipeShrinkExample/SwipeShrinkExample.xcodeproj \
            -scheme SwipeShrinkExample \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
