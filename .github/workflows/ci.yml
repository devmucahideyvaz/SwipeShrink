name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Unit tests (SwiftPM)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: swift test --enable-code-coverage

  build-ios:
    name: Build for iOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build package
        run: |
          xcodebuild build \
            -scheme SwipeShrink \
            -destination 'generic/platform=iOS Simulator'

  build-example:
    name: Build example app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build example
        run: |
          xcodebuild build \
            -project SwipeShrinkExample/SwipeShrinkExample.xcodeproj \
            -scheme SwipeShrinkExample \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            CODE_SIGNING_ALLOWED=NO
